<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JADARA - Catálogo Oficial</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- Encabezado con tu Marca y Logo -->
    <header>
        <div class="header-container">
            <img src="imagenes/logo.png" alt="Logo JADARA" class="logo">
            <h1>JADARA</h1>
            <p class="eslogan">Belleza con propósito</p>
        </div>
    </header>

    <!-- Contenedor del Catálogo -->
    <main class="catalogo">

        <!-- PRODUCTO 1 -->
        <div class="tarjeta-producto">
            <img src="imagenes/producto1.jpg" alt="Producto 1" class="foto-producto">
            <div class="info-producto">
                <h3>Nombre del Producto 1</h3>
                <p class="descripcion">Descripción del producto de belleza, beneficios y modo de uso.</p>
                <span class="precio">$50.000 COP</span>
                <!-- Reemplaza el número de abajo por tu celular real para recibir los mensajes -->
                <a href="https://wa.me" target="_blank" class="btn-whatsapp">
                    Pedir por WhatsApp
                </a>
            </div>
        </div>

    </main>

    <footer>
        <p>© 2026 JADARA - Belleza con propósito. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
